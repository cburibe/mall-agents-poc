[project]
name = "pre-token"
version = "0.1.0"
description = "Cognito Pre Token Generation V2: copia mall_id y roles validados al access token"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-lambda-powertools[tracer]>=3.20,<4",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
]

[tool.uv]
package = false
# Solo releases con >= 2 semanas de antigüedad al momento de bloquear (cadena de suministro).
exclude-newer = "2026-10-30T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
