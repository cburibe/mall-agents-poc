# BP-GH-02. No hay workflows de GitHub Actions (CI/CD con CDK Pipelines, ADR-009).
version: 2
updates:
  - package-ecosystem: npm
    directory: /infra
    schedule: { interval: weekly }
    groups:
      aws-cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', '@aws-cdk/*']
    ignore:
      # TS 7 (nativo) no es compatible aún con typescript-eslint (<6.1) ni ts-jest (<7).
      - dependency-name: typescript
        versions: ['>=7']
      # Los tipos de Node siguen al runtime (Node 24 en .nvmrc, CodeBuild y Lambda); se suben junto con él.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directories:
      - /
      - /functions/identity/pre_token
      - /functions/identity/seed_users
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
